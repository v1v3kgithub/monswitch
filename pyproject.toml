[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monswitch"
version = "0.0.0"
description = "Switch an external monitor's input source over DDC/CI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# The core is standard-library only, by design (ADR-0005). GTK comes from system
# python3-gi and is deliberately NOT a dependency here (ADR-0012).
dependencies = []

[project.scripts]
monswitch = "monswitch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# This file exists so that `pipx install .` and `pip install --user .` work where the
# environment permits them, but it is not the documented install path: ADR-0012 ships the
# Ulauncher extension with its own sys.path wiring, because PEP 668 blocks pip on the
# reference distribution and the Ulauncher daemon runs the system interpreter.

[tool.pytest.ini_options]
# src layout without an install step.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
# Matches how this codebase was already written; chosen to keep prose comments readable
# rather than to hit a round number.
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
# Selected explicitly rather than relying on ruff's defaults, which change between
# releases: CI pins a ruff version, and the rule set should not drift under it either.
select = ["E", "F", "W", "I", "B", "SIM", "UP", "RUF", "C4", "PIE"]
ignore = [
  # The extension deliberately imports after a sys.path bootstrap (ADR-0012), and the GTK
  # layer imports gi lazily so the module stays importable without PyGObject.
  "E402",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into internals on purpose: asserting that a private argv builder produces the
# exact setvcp command is the point, not a smell.
"tests/*" = ["B017", "SIM117"]
