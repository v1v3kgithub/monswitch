name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No dependencies to install: the core is standard-library only, by design (ADR-0005),
      # and the suite needs neither ddcutil nor a monitor. GTK is deliberately absent here --
      # the picker's logic lives in core/picker.py and is tested without a toolkit, so this
      # job also proves the module imports and degrades cleanly where PyGObject is missing.
      - name: Run tests with no dependencies at all
        run: PYTHONPATH=src python -m unittest discover -s tests -t tests -v

      - name: Run tests under pytest
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/ -q

  gtk:
    name: tests with GTK present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The GTK-version guards (Gdk 3.0 vs 4.0) only mean something where both typelibs
      # exist, which is the configuration that broke the picker on the reference machine.
      # Retried: this step has failed on "Temporary failure resolving
      # 'security.ubuntu.com'" with no test having run. A red badge caused by a mirror
      # outage is worse than no badge, because it teaches you to ignore the ones that mean
      # something.
      - name: Install PyGObject and GTK 3
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends \
                 python3-gi gir1.2-gtk-3.0 gir1.2-gtk-4.0; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::could not install GTK packages after 3 attempts"
          exit 1

      - name: Run tests against the system interpreter
        run: |
          python3 -m pip install --quiet --break-system-packages pytest
          PYTHONPATH=src python3 -m pytest tests/ -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: an unpinned linter turns an unrelated upstream release into a red build on
      # a commit that changed nothing. The rule set is pinned too, in pyproject.
      - run: python -m pip install --quiet ruff==0.17.4
      - run: ruff check --output-format=github .
      - run: ruff format --check --diff .

  no-writes:
    name: no setvcp in the test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setvcp 60 changes physical hardware and cannot be undone from software, so the suite
      # must never issue one. Two invariants: the read-only wrapper exposes no write method,
      # and every mention of setvcp in tests is an assertion about a fake runner rather than
      # a real invocation.
      - name: The read-only wrapper must stay read-only
        run: |
          PYTHONPATH=src python3 - <<'PY'
          from monswitch.core.ddc import Ddcutil, WriteCapableDdcutil
          assert not hasattr(Ddcutil, "set_input"), "Ddcutil gained a write method"
          assert hasattr(WriteCapableDdcutil, "set_input")
          print("ok: writing requires WriteCapableDdcutil by name")
          PY

      - name: No test may construct a real runner alongside a write
        run: |
          if grep -rn "_subprocess_runner" tests/ ; then
            echo "::error::a test references the real subprocess runner"
            exit 1
          fi
          echo "ok: no test can execute ddcutil for real"
